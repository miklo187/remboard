AutoName: remboard
Summary: Encrypted phone-PC clipboard and file sync over the local network
Description: |
    Send text and files between your phone and PC over the local network,
    end-to-end encrypted with CurveZMQ (Curve25519), with no cloud service
    and no account. Pair with a PC by scanning a QR code; once paired,
    devices find each other automatically over mDNS.


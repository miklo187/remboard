# Draft F-Droid metadata for remboard, to be copied into fdroiddata's
# metadata/ directory (as dev.miklo.remboard.yml) when submitting a merge
# request there: https://gitlab.com/fdroid/fdroiddata
#
# The two build-portability blockers this needed are resolved as of
# v0.1.1: libsodium, libzmq, protobuf (and its transitive abseil-cpp
# dependency), cppzmq, and nlohmann_json are all vendored as git
# submodules under third_party/ instead of being fetched over the network
# mid-build (core/CMakeLists.txt prefers the local submodule when present,
# falling back to the network fetch otherwise -- see its comments), and
# the build no longer hardcodes a host-specific protoc path. Verified with
# a full clean rebuild that no network fetches happen for those five
# dependencies.


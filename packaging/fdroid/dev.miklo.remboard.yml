# Draft F-Droid metadata for remboard, to be copied into fdroiddata's
# metadata/ directory (as dev.miklo.remboard.yml) when submitting a merge
# request there: https://gitlab.com/fdroid/fdroiddata
#
# NOT YET SUBMITTABLE AS-IS -- see the "Known blockers" note at the bottom
# before opening the MR. F-Droid's build servers have no network access
# during the build, and core/CMakeLists.txt currently fetches libsodium,
# libzmq, and protobuf from GitHub via CMake FetchContent when building for
# Android (REMBOARD_VENDOR_DEPS defaults on for ANDROID builds). That has to
# be resolved -- via F-Droid's srclibs mechanism or vendored sources -- for
# a real build to succeed on their infrastructure.

Categories:
  - Connectivity
License: MIT
AuthorName: Miklo
SourceCode: https://github.com/miklo187/remboard
IssueTracker: https://github.com/miklo187/remboard/issues
Changelog: https://github.com/miklo187/remboard/releases

AutoName: remboard
Summary: Encrypted phone-PC clipboard and file sync over the local network
Description: |
    Send text and files between your phone and PC over the local network,
    end-to-end encrypted with CurveZMQ (Curve25519), with no cloud service
    and no account. Pair with a PC by scanning a QR code; once paired,
    devices find each other automatically over mDNS.

RepoType: git
Repo: https://github.com/miklo187/remboard.git

